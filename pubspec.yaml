name: rayna_app
description: "Rayna — A private app for couples in long distance relationships."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Typography
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: ^4.2.1
  firebase_analytics: ^12.0.4
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.2
  firebase_storage: ^13.6.1
  firebase_messaging: ^16.7.1

  # Media
  image_picker: ^1.2.4

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2

  # Device & Battery
  battery_plus: ^6.2.1

  # Local notifications
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
